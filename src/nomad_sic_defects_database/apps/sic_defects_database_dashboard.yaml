widgets:
  - layout:
      lg:  {h: 9, w: 12, x: 0,  y: 0}
      md:  {h: 9, w: 12, x: 0,  y: 0}
      sm:  {h: 9, w: 12, x: 0,  y: 0}
      xl:  {h: 9, w: 14, x: 0,  y: 0}
      xxl: {h: 9, w: 13, x: 0,  y: 0}
    quantity: 'results.material.elements'
    scale: linear
    type: periodictable

  - layout:
      lg:  {h: 5, w: 6, x: 12, y: 0}
      md:  {h: 5, w: 6, x: 12, y: 0}
      sm:  {h: 5, w: 6, x: 12, y: 0}
      xl:  {h: 5, w: 6, x: 12, y: 0}
      xxl: {h: 5, w: 6, x: 13, y: 0}
    quantity: 'results.material.functional_type'
    scale: linear
    show_input: true
    type: terms
    title: 'Intrinsic Components'

  - layout:
      lg:  {h: 5, w: 6, x: 18, y: 0}
      md:  {h: 5, w: 6, x: 18, y: 0}
      sm:  {h: 5, w: 6, x: 18, y: 0}
      xl:  {h: 5, w: 6, x: 18, y: 0}
      xxl: {h: 5, w: 7, x: 19, y: 0}
    quantity: 'results.material.compound_type'
    scale: linear
    show_input: true
    type: terms
    title: 'Name'

  - layout:
      lg:  {h: 4, w: 12, x: 12, y: 4}
      md:  {h: 4, w: 12, x: 12, y: 4}
      sm:  {h: 4, w: 12, x: 12, y: 4}
      xl:  {h: 4, w: 12, x: 12, y: 4}
      xxl: {h: 4, w: 13, x: 13, y: 4}
    quantity: 'data.results_search.energy_level#nomad_sic_defects_database.schema_packages.defect_schema.SiCDefect'
    scale: linear
    show_input: true
    type: histogram
    title: 'Energy Level'

  
      
